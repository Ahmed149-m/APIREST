spring.application.name=patient-api
server.port=8080

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:patientsdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
# Base64-encoded 256-bit secret for HS256. Replace in real projects.
app.jwt.secret=TXlUUDJQYXRpZW50QXBwU2VjcmV0S2V5MTIzNDU2Nzg5MDEyMzQ1Ng==
app.jwt.expiration-ms=86400000

# CORS
app.cors.allowed-origins=http://localhost:8081,http://localhost:19006,http://localhost:3000